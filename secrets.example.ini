# ============================================================
#  secrets.ini —— 本地私密配置（★ 不要提交到 Git，已在 .gitignore 中）
#
#  用法：
#    1. 把本文件复制为 secrets.ini
#    2. 填入你自己的 WiFi 与巴法云私钥
#    3. 直接编译：PlatformIO 会自动把本文件 AES-128 加密进固件
#
#  ★ 加密口令 passphrase 只在本机使用：它不会被写进源码或固件，
#    但请自己保存好 —— 改了它就要重新编译。
#  ★ 本文件本身是明文，请勿截图、勿提交、勿上传网盘。
# ============================================================

[secrets]
# 加密口令：建议 16 位以上随机字符串（字母 + 数字 + 符号）
passphrase = 请改成一串足够长的随机口令

# WiFi：必须是 2.4G 热点（ESP32-S3 搜不到 5G）
wifi_ssid = 你的2.4G热点名
wifi_password = 你的WiFi密码

# 巴法云「连接密钥」页里的 32 位私钥（只填十六进制字符）
bemfa_uid = 你的32位巴法云私钥
