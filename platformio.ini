; ============================================================
;  ESP32-S3 项目配置模板
;  芯片模块 : ESP32-S3-WROOM-1  N16R8 (16MB Flash + 8MB PSRAM)
;  开发框架 : Arduino
; ------------------------------------------------------------
;  编译 : Ctrl + Alt + B
;  烧录 : Ctrl + Alt + U
;  串口 : Ctrl + Alt + S
; ============================================================

[platformio]
; ★ 把「项目根目录」也加进头文件搜索路径
;   这样下面两种 include 写法【都能编译】：
;     #include "src/04_driver/inc/uart.h"    ← Arduino IDE 风格（从项目根算）
;     #include "04_driver/inc/uart.h"        ← PlatformIO 风格（从 src 算）
;   从 Arduino IDE 迁移过来的代码不用改 include 就能直接编译
include_dir = .

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 串口监视器波特率
monitor_speed = 115200

; ===== 16MB Flash =====
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

; ===== 8MB 八线 PSRAM =====
; N16R8 = 四线(Quad) Flash + 八线(Octal) PSRAM
; 不加这一行 PSRAM 就是 0，需要大内存的程序会崩
board_build.arduino.memory_type = qio_opi

; -Iinclude                : include_dir 改成 . 之后，补回默认的 include\ 文件夹
; -DBOARD_HAS_PSRAM        : 让 Arduino 核心启动时初始化 PSRAM
; -DARDUINO_USB_CDC_ON_BOOT: 原生 USB 口也能输出串口
build_flags =
    -Iinclude
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ===== 构建前自动生成加密密钥头文件 =====
; 读取本地 secrets.ini（已 gitignore）→ AES-128 加密 → src/05_secrets/gen/secret_blob.h
; 没有 secrets.ini 时生成「演示模式」头文件，工程仍可编译、可烧录
extra_scripts = pre:tools/pio_secrets.py

; 注意：这里故意不写 upload_port
; 每台电脑串口号不同，PlatformIO 会自动检测
